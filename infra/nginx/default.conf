server {
  listen 80;
  server_name _;
  client_max_body_size 10m;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Do not forward an arbitrary client X-Geo-Country value. In production,
    # replace the empty value below with the country code supplied by your
    # trusted CDN/GeoIP module, then set TRUST_GEO_COUNTRY_HEADER=true.
    proxy_set_header X-Geo-Country "";
  }

  location /health {
    proxy_pass http://api:3000;
  }
}
