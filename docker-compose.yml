services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: breezereels
      POSTGRES_USER: breezereels
      POSTGRES_PASSWORD: change-this-local-password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breezereels -d breezereels"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
