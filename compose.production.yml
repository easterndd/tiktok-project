services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${QUICKREELS_ENV_FILE:-.env.production}
    dns:
      - 183.60.83.19
      - 183.60.82.98
    restart: unless-stopped
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - cover_assets:/var/lib/quickreels/cover-assets
    networks:
      - quickreels-proxy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${QUICKREELS_ENV_FILE:-.env.production}
    dns:
      - 183.60.83.19
      - 183.60.82.98
    command: ["node", "dist/jobs/tiktok-short-drama.worker.js"]
    restart: unless-stopped
    volumes:
      - cover_assets:/var/lib/quickreels/cover-assets
    networks:
      - quickreels-proxy

  admin:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL before building}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - quickreels-proxy

networks:
  quickreels-proxy:
    external: true

volumes:
  cover_assets:
