server {
    # 封面图是高频静态资源，源站 access log 没有分析价值：
    # 每张图一行会把容器 stdout 日志刷到每天 2G（曾累积 56G）。
    # 流量分析请在 CDN / 网关层做。
    access_log off;
    listen 80;
    server_name _;
    location ~ "^/api/v1/assets/covers/(?<cover>[a-f0-9]{64}\.(jpg|png|webp)(\.w360\.webp)?)$" {
        alias /usr/share/nginx/html/covers/$cover;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Cover-Service static always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / { return 404; }
}
