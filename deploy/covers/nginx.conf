server {
    listen 80;
    server_name _;
    location ~ "^/api/v1/assets/covers/(?<cover>[a-f0-9]{64}\.(jpg|png|webp)(\.w360\.webp)?)$" {
        alias /usr/share/nginx/html/covers/$cover;
        add_header Access-Control-Allow-Origin * always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Cover-Service static always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }
    location / { return 404; }
}
