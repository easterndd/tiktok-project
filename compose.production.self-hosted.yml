services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${QUICKREELS_ENV_FILE:-.env.production}
    dns:
      - 183.60.83.19
      - 183.60.82.98
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - cover_assets:/var/lib/quickreels/cover-assets
    networks:
      - quickreels-proxy
      - quickreels-internal

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${QUICKREELS_ENV_FILE:-.env.production}
    dns:
      - 183.60.83.19
      - 183.60.82.98
    command: ["node", "dist/jobs/tiktok-short-drama.worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - cover_assets:/var/lib/quickreels/cover-assets
    networks:
      - quickreels-internal

  admin:
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL before building}
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - quickreels-proxy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.production}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.production}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - quickreels-internal

networks:
  quickreels-proxy:
    external: true
  quickreels-internal:
    internal: true

volumes:
  postgres_data:
  cover_assets:
