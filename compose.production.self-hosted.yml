services:
  covers:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - cover_assets:/usr/share/nginx/html/covers:ro
      - ./deploy/covers/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    networks:
      - quickreels-proxy

  api:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${QUICKREELS_ENV_FILE:-.env.production}
    environment:
      LOCAL_UPLOAD_STORAGE_DIR: /var/lib/quickreels/video-uploads
      DATABASE_POOLER_HOST: pgbouncer
    dns:
      - 183.60.83.19
      - 183.60.82.98
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    volumes:
      - cover_assets:/var/lib/quickreels/cover-assets
      - video_uploads:/var/lib/quickreels/video-uploads
    networks:
      - quickreels-proxy
      - quickreels-internal

  worker:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - ${QUICKREELS_ENV_FILE:-.env.production}
    environment:
      LOCAL_UPLOAD_STORAGE_DIR: /var/lib/quickreels/video-uploads
      DATABASE_POOLER_HOST: pgbouncer
    dns:
      - 183.60.83.19
      - 183.60.82.98
    command: ["node", "dist/jobs/tiktok-short-drama.worker.js"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
    volumes:
      - cover_assets:/var/lib/quickreels/cover-assets
      - video_uploads:/var/lib/quickreels/video-uploads
    networks:
      - quickreels-proxy
      - quickreels-internal

  admin:
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?set VITE_API_BASE_URL before building}
        VITE_TALETV_API_BASE_URL: ${VITE_TALETV_API_BASE_URL:-}
